name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -match "refs/tags/(v[0-9.]+)") {
            $tag = $Matches[1]
          } elseif ($ref -match "refs/heads/master") {
            $tag = "v0.1.5"
          } else {
            $tag = "v0.1.5"
          }
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "TAG=$tag" >> $env:GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --clean stock-metadata-agent.spec

      - name: Package release
        run: |
          Compress-Archive -Path "dist\stock-metadata-agent" -DestinationPath "dist\AI Stock Metadata Agent v${{ env.VERSION }} (Windows).zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist\AI Stock Metadata Agent v${{ env.VERSION }} (Windows).zip

      - name: Upload to release
        run: |
          gh release upload ${{ env.TAG }} "dist\AI Stock Metadata Agent v${{ env.VERSION }} (Windows).zip" --repo ${{ github.repository }} --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
